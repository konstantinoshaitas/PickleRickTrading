data:
  start: '2018-01-01'
  interval: 1d
  data_source: yfinance

strategy:
  # Default strategy if not overridden in 'assets'
  name: ensemble
  params:
    ema_fast: 21
    ema_mid: 55
    ema_slow: 200
    fastperiod: 12
    slowperiod: 26
    signalperiod: 9

backtest:
  init_cash: 100000
  fees: 0.001
  slippage: 0.001
  freq: D
  train_ratio: 0.6

grid:
  metric: sharpe_ratio

portfolio:
  tickers:
    - BTC-USD
    - ETH-USD
    - AAPL
    - GOOG
    - MSFT
    - AMZN
    - GLD
  safe_haven_ticker: GLD
  
  # Default portfolio parameters
  rsi_period: 14
  rsi_threshold: 50.0
  top_k: 3

  # Portfolio grid search parameters
  grid:
    rsi_threshold: [40, 50, 60, 70]
    top_k: [2, 3, 5]
    rsi_period: [10, 14, 21]

  # Per-asset strategy overrides
  assets:
    BTC-USD:
      strategy: ensemble
      params:
        ema_fast: 50
        ema_mid: 100
        ema_slow: 200
        fastperiod: 12
        slowperiod: 26
        signalperiod: 9
    
    ETH-USD:
      strategy: triple_ema
      params:
        ema_fast: 10
        ema_mid: 20
        ema_slow: 50
