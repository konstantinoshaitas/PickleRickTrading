data:
  ticker: SOL
  start: '2018-01-01'
  end:
  interval: 1d
  data_source: alphavantage  # Options: "yfinance" or "alphavantage"
  asset_type:  # Options: "crypto", "stock", or empty (auto-detect from ticker format)
  local_csv:
  cache_csv: data/cache/SOL_1D.csv

strategy:
  name: ensemble_unconstrained
  params:  #
    # ema_fast: 12
    # ema_mid: 22 
    # ema_slow: 82
    # fastperiod: 20
    # slowperiod: 27
    # signalperiod: 28
    ema_fast: 59
    ema_mid: 126 
    ema_slow: 39
    fastperiod: 20
    slowperiod: 27
    signalperiod: 28
  grid:
    ema_fast: "2:35:4" 
    ema_mid: "50:170:5"   
    ema_slow: "60:200:10"   
    fastperiod: "5:40:3"   
    slowperiod: "40:90:5"
    signalperiod: "5:90:5"

backtest:
  init_cash: 100000
  fees: 0.0004
  slippage: 0.0002
  freq: D
  train_ratio: 0.6

grid:
  metric: sharpe_ratio
  top_n: 3
