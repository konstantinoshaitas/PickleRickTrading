# Exact old six-pair / 1,000-base-unit experiment. Keep for comparison, not the new USD sizing.
pairs: [EURUSD, AUDUSD, NZDUSD, EURAUD, EURNZD, AUDNZD]
providers: [Broadway]
quantity: 1000
stale_ms: 2000
traded_side_max_age_s: 2
untraded_side_max_age_s: 2
broker_row_max_age_s: 2
require_quote_size: true
reject_flagged_quotes: true
frozen_max_age_s: 2
indicative_max_age_s: 2
indicative_crossed_mid: false
