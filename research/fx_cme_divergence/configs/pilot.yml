        GBPAUD, GBPNZD, GBPUSD, GBPCAD, GBPCHF, GBPJPY,
        AUDNZD, AUDUSD, AUDCAD, AUDCHF, AUDJPY,
        NZDUSD, NZDCAD, NZDCHF, NZDJPY, USDCAD, USDCHF, USDJPY, CADCHF, CADJPY, CHFJPY]
providers: [Broadway]
stage: baseline
latency_ms: 100
