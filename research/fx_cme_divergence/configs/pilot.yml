# Dates omitted: resolve last three COMPLETED calendar months at execution.
# All 28 actual broker pair spellings; no pair priority. Also includes USD conversion pairs.
pairs: [EURGBP, EURAUD, EURNZD, EURUSD, EURCAD, EURCHF, EURJPY,
        GBPAUD, GBPNZD, GBPUSD, GBPCAD, GBPCHF, GBPJPY,
        AUDNZD, AUDUSD, AUDCAD, AUDCHF, AUDJPY,
        NZDUSD, NZDCAD, NZDCHF, NZDJPY, USDCAD, USDCHF, USDJPY, CADCHF, CADJPY, CHFJPY]
providers: [Broadway]
stage: baseline
latency_ms: 100
stale_ms: 2000  # persistence continuity and preclosure basis CME age only
traded_side_max_age_s: 240  # freshness of the side we trade and its USD conversion
untraded_side_max_age_s: null  # the other side may be stale
broker_row_max_age_s: null  # no whole-row age rule
require_quote_size: false
reject_flagged_quotes: false
frozen_max_age_s: 300  # last trade before the close, generous closure allowance
indicative_max_age_s: 3600  # resting pre-open book may be an hour old
indicative_crossed_mid: true  # crossed CME pre-open legs use their mid
persistence_ms: 1000
notional_usd: 100000
quantity: null  # set only to reproduce the old fixed-base-unit experiment
cash: 100000
commission_bps: null  # Unknown, not an assertion of zero fees.
financing_quote: null
slippage_bps: 0
exit_wait_s: 30
max_hold_s: 7200
roll_buffer_days: 2
min_basis_samples: 5
allow_calendar_fallback: false
