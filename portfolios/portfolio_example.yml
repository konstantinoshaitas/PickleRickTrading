data:
  start: '2018-01-01'
  interval: 1d
  data_source: yfinance

strategy:
  # Default strategy if not overridden in 'assets'
  name: ensemble_unconstrained
  params:
    ema_fast: 21
    ema_mid: 55
    ema_slow: 200
    fastperiod: 12
    slowperiod: 26
    signalperiod: 9

backtest:
  init_cash: 100000
  fees: 0.004
  slippage: 0.001
  freq: D
  train_ratio: 0.6

grid:
  metric: sharpe_ratio

portfolio:
  tickers:
    - AAPL
    - AMZN
    - BTC
    - ETH
    - SOL
    - META
    - VOO
    - GOOG
    - QQQ
    - GLD
  safe_haven_ticker: GLD
  
  # Default portfolio parameters
  rsi_period: 90
  rsi_threshold: 50.0
  top_k: 3

  # Portfolio grid search parameters
  grid:
    rsi_threshold: "45:55:2"
    top_k: "1:6:1"
    rsi_period: "10:110:1"

  # Per-asset strategy overrides
  # Example: cache_csv: data/cache/custom_BTC_path.csv
  assets:
    BTC:
      strategy: ensemble_unconstrained  
      params:
        ema_fast: 25
        ema_mid: 165
        ema_slow: 100
        fastperiod: 89
        slowperiod: 116
        signalperiod: 70
      # cache_csv: data/cache/custom_BTC_path.csv  # Optional: override auto-detected cache path
    ETH:
      strategy: ensemble_unconstrained
      params:
        ema_fast: 5
        ema_mid: 115
        ema_slow: 100
        fastperiod: 4
        slowperiod: 66
        signalperiod: 55
    
    AMZN:
